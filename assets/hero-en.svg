<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Gemini is the most comfortable model to talk to but careless, with a poor harness; Claude has superb taste and an unbeatable harness. claude-x-gemini joins them: Gemini talks with you, Claude gets the work done.">
  <style>
    .sans { font-family: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif; }
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="1280" height="720" fill="#0e2a32"/>
  <g opacity="0.10" fill="none" stroke="#9fd3d0" stroke-width="2">
    <path d="M-40 640 C 200 600, 380 680, 640 640 S 1080 600, 1320 650"/>
    <path d="M-40 680 C 240 650, 420 720, 700 680 S 1100 650, 1320 690"/>
  </g>
  <text x="640" y="92" text-anchor="middle" class="sans" font-size="54" font-weight="700" fill="#f3efe6">Claude × Gemini</text>
  <text x="640" y="140" text-anchor="middle" class="sans" font-size="26" fill="#a9c7c4">Gemini's best-in-class conversation, on Claude's unbeatable harness</text>

  <g transform="translate(80,190)">
    <rect width="520" height="300" rx="22" fill="#132f38" stroke="#4f8df5" stroke-width="2"/>
    <text x="36" y="62" class="sans" font-size="36" font-weight="700" fill="#8fb4ff">Gemini</text>
    <g class="sans" font-size="26">
      <text x="36" y="122" fill="#f3efe6">✓ the most comfortable to talk to</text>
      <text x="36" y="170" fill="#cfd8d6">✓ decent taste</text>
      <text x="36" y="218" fill="#8e9c9a">✗ careless</text>
      <text x="36" y="266" fill="#8e9c9a">✗ a shit harness</text>
    </g>
  </g>
  <g transform="translate(680,190)">
    <rect width="520" height="300" rx="22" fill="#132f38" stroke="#e0895a" stroke-width="2"/>
    <text x="36" y="62" class="sans" font-size="36" font-weight="700" fill="#f2a679">Claude</text>
    <g class="sans" font-size="26">
      <text x="36" y="122" fill="#cfd8d6">✓ pretty good to talk to</text>
      <text x="36" y="170" fill="#f3efe6">✓ superb taste</text>
      <text x="36" y="218" fill="#8e9c9a">~ so-so rigor</text>
      <text x="36" y="266" fill="#f3efe6">✓ an unbeatable harness</text>
    </g>
  </g>
  <text x="640" y="350" text-anchor="middle" class="sans" font-size="64" font-weight="700" fill="#f3efe6">+</text>

  <g transform="translate(80,530)">
    <rect width="1120" height="104" rx="22" fill="#f3efe6"/>
    <text x="40" y="47" class="mono" font-size="30" font-weight="700" fill="#0e2a32">claude-x-gemini</text>
    <text x="40" y="84" class="sans" font-size="24" fill="#24424a">Gemini reads, explains, talks your idea through → Claude checks it and gets the work done</text>
  </g>
  <text x="1200" y="676" text-anchor="end" class="sans" font-size="18" fill="#7fa3a0">Comparison quoted from @Khazix0918</text>
</svg>
